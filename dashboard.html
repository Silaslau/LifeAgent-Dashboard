<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeAgent · 公开演示</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --sunk: #f1f0ec;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
  --hair: rgba(11, 11, 11, .10); --grid: #e1e0d9; --axis: #c3c2b7;
  --s-location: #2a78d6; --s-photo: #eb6834; --s-calendar: #1baf7a; --s-health: #eda100; --s-self: #e87ba4; --s-other: #898781;
  --on-location: #fff; --on-photo: #fff; --on-calendar: #fff; --on-health: #0b0b0b; --on-self: #fff; --on-other: #fff;
  --seq-strong: #256abf; --seq-mid: #86b6ef; --seq-track: #e3edfa;
  --good: #0ca30c; --critical: #d03b3b; --warning: #fab219;
  --card-bar: #5f5e5a; --card-ink: #ffffff;
  --code: #f1f0ec;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222220; --sunk: #151514;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
    --hair: rgba(255, 255, 255, .10); --grid: #2c2c2a; --axis: #383835;
    --s-location: #3987e5; --s-photo: #d95926; --s-calendar: #199e70; --s-health: #c98500; --s-self: #d55181;
    --on-health: #fff;
    --seq-strong: #9ec5f4; --seq-mid: #3987e5; --seq-track: rgba(57, 135, 229, .20);
    --card-bar: #c3c2b7; --card-ink: #0b0b0b;
    --code: #151514;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #222220; --sunk: #151514;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
  --hair: rgba(255, 255, 255, .10); --grid: #2c2c2a; --axis: #383835;
  --s-location: #3987e5; --s-photo: #d95926; --s-calendar: #199e70; --s-health: #c98500; --s-self: #d55181;
  --on-health: #fff;
  --seq-strong: #9ec5f4; --seq-mid: #3987e5; --seq-track: rgba(57, 135, 229, .20);
  --card-bar: #c3c2b7; --card-ink: #0b0b0b;
  --code: #151514;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; font: 14px/1.6 var(--sans); color: var(--ink); background: var(--page); }
button { font: inherit; color: inherit; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: .01em; }
h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
p { margin: 0 0 8px; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 32px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 24px; padding-bottom: 10px; }
.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
.tabbar { position: sticky; top: 0; z-index: 10; background: var(--page); border-bottom: 1px solid var(--hair); }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px 8px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
main { padding-top: 24px; padding-bottom: 96px; }
.block { margin: 0 0 40px; }
.lead { color: var(--ink-2); margin: 0 0 16px; max-width: 78ch; }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 16px 20px; }
.panel + .panel { margin-top: 16px; }
.grid2 > .panel, .grid3 > .panel { margin-top: 0; }
.stack > * + * { margin-top: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.cap { font-size: 12px; color: var(--ink-3); margin: 12px 0 6px; }
.cap:first-child { margin-top: 0; }
pre.code { background: var(--code); border-radius: 8px; padding: 10px 12px; font: 12px/1.55 var(--mono); overflow: auto; max-height: 340px; margin: 0 0 8px; white-space: pre; tab-size: 2; }
pre.code.wrap { white-space: pre-wrap; word-break: break-all; }
pre.code.tall { max-height: 520px; }
code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; }
ul.notes { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
ul.notes li + li { margin-top: 2px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--ink-2); border-bottom: 1px solid var(--axis); padding: 6px 8px; white-space: nowrap; }
table.t td { border-bottom: 1px solid var(--grid); padding: 6px 8px; vertical-align: top; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--sunk); }
table.t tr.sel td { background: var(--sunk); box-shadow: inset 0 1px 0 var(--ink-2), inset 0 -1px 0 var(--ink-2); }
table.t tr.rel td { background: var(--sunk); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.scroll { overflow: auto; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--hair); border-radius: 999px; padding: 0 8px; font-size: 12px; line-height: 20px; color: var(--ink-2); background: var(--raised); white-space: nowrap; vertical-align: middle; }
.chip.solid { background: var(--ink); color: var(--page); border-color: var(--ink); }
.chip.ghost { border-style: dashed; color: var(--ink-3); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.btn { background: var(--raised); border: 1px solid var(--hair); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.btn:hover { color: var(--ink); border-color: var(--axis); }
.btn[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--raised); border: 0; padding: 4px 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--hair); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spread { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.stat-ok, .stat-bad, .stat-warn { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.stat-ok::before, .stat-bad::before, .stat-warn::before { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; font-size: 10px; font-weight: 700; color: #fff; }
.stat-ok::before { content: "✓"; background: var(--good); }
.stat-bad::before { content: "✗"; background: var(--critical); }
.stat-warn::before { content: "!"; background: var(--warning); color: #0b0b0b; }
.empty { border: 1px dashed var(--axis); border-radius: 12px; padding: 16px 20px; color: var(--ink-2); background: transparent; }
.empty h3 { color: var(--ink); margin-bottom: 4px; }
.tip { position: fixed; z-index: 50; max-width: 380px; background: var(--raised); color: var(--ink); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; pointer-events: none; }
.tip .tip-h { font-weight: 600; }
.tip .tip-l { color: var(--ink-2); }

/* 流程条 */
.pipe { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.stage { flex: 1 1 140px; min-width: 140px; background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; }
.stage:hover { border-color: var(--axis); }
.stage b { display: block; font-weight: 600; }
.stage .mono { display: block; color: var(--ink-2); margin: 2px 0; word-break: break-all; }
.stage span { font-size: 12px; color: var(--ink-3); }
.arrow { align-self: center; color: var(--ink-3); }

/* 目标架构图（核心设计 5.11 节）：上一行是设计，下一行是第一版，按列对齐 */
.arch-scroll { overflow-x: auto; margin: -6px; padding: 6px; }
.arch { display: grid; min-width: 1154px; font-size: 12px; line-height: 1.45;
  grid-template-columns: minmax(104px, 1fr) 18px minmax(96px, 1.05fr) 18px minmax(140px, 1.45fr) 18px minmax(104px, 1.1fr) 18px
    minmax(98px, 1fr) 10px minmax(90px, .95fr) 10px minmax(90px, .95fr) 10px minmax(98px, 1fr) 18px minmax(92px, 1fr) 18px minmax(104px, 1.05fr);
  grid-template-rows: auto 26px 26px auto auto auto auto auto; }
.arch-lane { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; color: var(--ink-2); }
.arch-lane b { color: var(--ink); font-size: 13px; font-weight: 600; }
.arch-lane.v1 { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--grid); margin-bottom: 8px; }
.arch-legend { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.arch-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.arch-sw { display: inline-block; width: 16px; height: 10px; border-radius: 3px; }
.arch-sw.gemma { background: var(--ink); }
.arch-sw.code { background: var(--sunk); border: 1px solid var(--axis); }
.arch-sw.none { border: 1.5px dashed var(--axis); }
.arch-sw.loop { width: 22px; height: 0; border-radius: 0; border-top: 1.5px dashed var(--ink-3); }
.arch [data-arch] { cursor: pointer; outline: none; }
.arch [data-arch]:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--seq-strong); }
.arch-box, .arch-step { display: flex; flex-direction: column; gap: 2px; min-width: 0; background: var(--raised); border: 1px solid var(--axis); border-radius: 10px; padding: 8px; color: var(--ink-2); }
.arch .ln { display: block; word-break: keep-all; overflow-wrap: anywhere; }
.arch-box b, .arch-step b { font-size: 13px; font-weight: 600; color: var(--ink); }
.arch-box .lede { color: var(--ink); font-weight: 500; }
.arch-out { margin-top: auto; padding-top: 6px; font-size: 11px; color: var(--ink-3); }
.arch-out b { font-size: 12px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.arch-ev { grid-column: 9 / 16; grid-row: 4 / 6; background: var(--sunk); border: 1px solid var(--axis); border-radius: 12px; }
.arch-evhead { grid-column: 9 / 16; grid-row: 4; z-index: 1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 8px; padding: 8px 10px 6px; color: var(--ink-2); }
.arch-evhead b { font-size: 13px; font-weight: 600; color: var(--ink); }
.arch-evhead .arch-out { margin-top: 0; padding-top: 0; }
.arch-step { z-index: 1; margin-bottom: 8px; }
.arch-step.first { margin-left: 8px; }
.arch-step.last { margin-right: 8px; }
.arch-arrow { display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 14px; }
.arch-arrow.mini { font-size: 11px; padding-bottom: 8px; }
.arch-rail { position: relative; margin-top: 13px; border: 1.5px dashed var(--ink-3); border-bottom: 0; border-radius: 6px 6px 0 0; }
.arch-rail::after { content: ""; position: absolute; left: -5.75px; bottom: 0; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 7px solid var(--ink-3); }
.arch-rail > span { position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--surface); border-radius: 6px; padding: 0 8px; color: var(--ink-2); }
.arch-rail > span:hover { color: var(--ink); }
.arch-v1 { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; background: var(--sunk); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 8px; color: var(--ink); }
.arch-v1 .miss { font-size: 11px; color: var(--ink-3); }
.arch-v1.none { background: transparent; border: 1.5px dashed var(--axis); color: var(--ink-3); }
.arch-v1.gemma { background: var(--ink); border-color: var(--ink); color: var(--page); margin-bottom: 6px; }
.arch-v1.gemma .mono { color: inherit; opacity: .8; word-break: break-all; }
.arch-tag { font-size: 11px; line-height: 16px; white-space: nowrap; border: 1px solid var(--axis); border-radius: 999px; padding: 0 6px; background: var(--raised); color: var(--ink-2); }
.arch-v1.none .arch-tag { border-style: dashed; background: transparent; color: var(--ink-3); }
.arch-v1.gemma .arch-tag { border-color: currentColor; background: transparent; color: inherit; font-weight: 600; }
.arch-box:hover, .arch-step:hover, .arch-v1:hover { border-color: var(--ink-2); }
.arch-v1.gemma:hover { border-color: var(--ink-2); }
.arch [data-arch].sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
.arch [data-arch].rel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--ink-3); }
.arch-hint { display: none; margin: 8px 0 0; font-size: 12px; color: var(--ink-3); }
.arch-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 10px; }
.arch-cols ul.notes { margin-top: 0; }
@media (max-width: 1271px) { .arch-hint { display: block; } }
@media (max-width: 900px) { .arch-cols { grid-template-columns: minmax(0, 1fr); } }

/* 时间轴 */
.tl { position: relative; user-select: none; }
.tl-row { display: grid; grid-template-columns: 108px minmax(0, 1fr); align-items: stretch; }
.tl-row + .tl-row { border-top: 1px solid var(--grid); }
.tl-label { font-size: 12px; color: var(--ink-2); padding: 6px 8px 6px 0; display: flex; align-items: center; gap: 6px; line-height: 1.3; }
.tl-label .muted { font-size: 11px; }
.tl-track { position: relative; height: 32px; }
.tl-row.axis .tl-track { height: 22px; }
.tl-row.axis { border-bottom: 1px solid var(--axis); }
.tl-row.out { background: var(--sunk); }
.tl-row.sep { border-top: 1px solid var(--axis); }
.tl-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--grid); pointer-events: none; }
.tl-ticklabel { position: absolute; top: 3px; font-size: 11px; color: var(--ink-3); transform: translateX(-50%); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-none { position: absolute; left: 8px; top: 8px; font-size: 11px; color: var(--ink-3); }
.m { position: absolute; top: 7px; height: 18px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; padding: 0 6px; font-size: 11px; white-space: nowrap; min-width: 4px; overflow: visible; outline: none; }
.m .ml { pointer-events: none; }
.m.thin { top: 13px; height: 6px; padding: 0; border-radius: 3px; }
.m.dot { top: 11px; width: 10px; height: 10px; min-width: 10px; padding: 0; margin-left: -5px; border-radius: 50%; }
.m.ring { background: var(--surface) !important; border: 2px solid; }
.m.plan { background: transparent !important; border: 1.5px dashed; color: var(--ink) !important; }
.m.card { background: var(--card-bar); color: var(--card-ink); }
.m.card.o-planned { background: transparent; border: 1.5px dashed var(--ink-2); color: var(--ink); }
.m.card.o-uncertain { background: transparent; border: 1.5px dotted var(--ink-2); color: var(--ink); }
.m.card.o-cancelled { background: var(--surface); border: 1px solid var(--axis); color: var(--ink-3); text-decoration: line-through; }
.m.ref { background: color-mix(in srgb, var(--s-self) 22%, var(--surface)); color: var(--ink); }
.m.episode { background: var(--card-bar); color: var(--card-ink); }
.m.arc { background: color-mix(in srgb, var(--card-bar) 30%, var(--surface)); color: var(--ink); }
.tl.has-sel .m:not(.sel):not(.rel) { opacity: .22; }
.m.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); z-index: 2; }
.m.rel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-2); z-index: 1; }
.m:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--seq-strong); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 18px; height: 10px; border-radius: 3px; }
.sw.dash { background: transparent; border: 1.5px dashed var(--ink-2); }
.sw.dotted { background: transparent; border: 1.5px dotted var(--ink-2); }
.sw.ring { width: 10px; border-radius: 50%; border: 2px solid var(--ink-2); }

/* 事件卡片 */
.cards { display: grid; gap: 10px; }
.ecard { background: var(--raised); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; }
.ecard.click { cursor: pointer; }
.ecard.click:hover { border-color: var(--axis); }
.ecard.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.ecard.rel { border-color: var(--ink-2); }
.ecard.dim { opacity: .45; }
.ecard .hd { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--ink-2); }
.occ { font-size: 12px; border-radius: 999px; padding: 0 8px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.occ.happened { background: var(--ink); color: var(--page); }
.occ.planned { border: 1.5px dashed var(--ink-2); color: var(--ink); line-height: 17px; }
.occ.uncertain { border: 1.5px dotted var(--ink-2); color: var(--ink); line-height: 17px; }
.occ.cancelled { background: var(--sunk); color: var(--ink-3); text-decoration: line-through; }
.ecard .title { font-size: 16px; font-weight: 600; margin: 6px 0 2px; line-height: 1.4; }
.ecard.big .title { font-size: 20px; }
.ecard .summary { color: var(--ink-2); margin: 0; }
.frows { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--grid); }
.fname { color: var(--ink-3); font-size: 12px; padding-top: 1px; }
.fval { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.fval .v { color: var(--ink); }
.fval.empty-f .v { color: var(--ink-3); }
.sup { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); border: 1px solid var(--hair); border-radius: 999px; padding: 0 7px 0 5px; line-height: 18px; white-space: nowrap; }
.meter { display: inline-flex; gap: 2px; }
.meter i { width: 5px; height: 10px; border-radius: 2px; background: var(--seq-track); display: block; }
.sup.s-observed .meter i.on, .sup.s-stated .meter i.on { background: var(--seq-strong); }
.sup.s-inferred .meter i.on { background: var(--seq-mid); }
.sup.s-conflict { border-color: var(--critical); }
.sup.s-conflict .meter i { background: var(--critical); }
.evc { display: inline-flex; align-items: center; gap: 4px; font: 11px/18px var(--mono); color: var(--ink-2); border: 1px solid var(--hair); background: var(--surface); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
button.evc { cursor: pointer; }
button.evc:hover, .evc.rel { border-color: var(--ink-2); color: var(--ink); }
.evc.sel { border-color: var(--ink); color: var(--ink); background: var(--sunk); }
.bar-ratio { display: inline-block; width: 56px; height: 6px; border-radius: 3px; background: var(--seq-track); position: relative; vertical-align: middle; }
.bar-ratio i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--seq-strong); }
.foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--grid); display: grid; gap: 6px; font-size: 12px; color: var(--ink-2); }
.foot .row { gap: 4px 6px; }
.conflict { display: flex; gap: 6px; align-items: baseline; }
.ribbon { font-size: 12px; color: var(--ink-2); background: var(--sunk); border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; }

/* 字段对照 */
.fgroups { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.fgroups .g { font-size: 12px; color: var(--ink-2); }
.fchip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; border-radius: 6px; padding: 1px 8px; margin: 0 4px 4px 0; border: 1px solid var(--axis); }
.fchip.v1 { background: var(--ink); color: var(--page); border-color: var(--ink); }
.fchip.only { border-style: dashed; color: var(--ink-2); }
.fchip .mono { font-size: 11px; opacity: .8; }

/* 证据能证明什么 */
.lvl { display: inline-block; min-width: 64px; text-align: center; border-radius: 6px; font-size: 12px; padding: 1px 6px; }
.lvl.proves { background: var(--seq-strong); color: var(--page); }
.lvl.suggests { background: var(--seq-track); color: var(--ink); }
.lvl.none { color: var(--ink-3); }

/* 日期选择 */
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.daychip { background: var(--raised); border: 1px solid var(--hair); border-radius: 8px; padding: 4px 8px; cursor: pointer; text-align: left; font-size: 12px; line-height: 1.35; min-width: 76px; }
.daychip:hover { border-color: var(--axis); }
.daychip[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.daychip.none { border-style: dashed; color: var(--ink-3); }
.daychip b { font-weight: 600; display: block; color: var(--ink); }
.daychip.none b { color: var(--ink-3); }

/* 统计 */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 12px 14px; }
.tile .k { font-size: 12px; color: var(--ink-2); }
.tile .v { font-size: 26px; font-weight: 600; line-height: 1.25; margin-top: 2px; }
.tile .s { font-size: 12px; color: var(--ink-3); }
.hbar { display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; align-items: center; gap: 8px; font-size: 12px; }
.hbar + .hbar { margin-top: 6px; }
.hbar .track { height: 10px; position: relative; }
.hbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s-location); border-radius: 0 4px 4px 0; }
details.run { border: 1px solid var(--hair); border-radius: 10px; background: var(--surface); }
details.run + details.run { margin-top: 8px; }
details.run summary { cursor: pointer; padding: 8px 12px; font-size: 13px; }
details.run .body { padding: 0 12px 12px; }
@media (max-width: 900px) {
  .wrap { padding: 0 16px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .tl-row { grid-template-columns: 76px minmax(0, 1fr); }
  .fgroups { grid-template-columns: minmax(0, 1fr); }
}
</style>

function archSelect(id) {
  state.arch = state.arch === id ? null : id;
  const rel = new Set((ARCH[state.arch] || {}).rel || []);
  document.querySelectorAll('.arch [data-arch]').forEach(el => {
    const me = el.dataset.arch;
    el.classList.toggle('sel', me === state.arch);
    el.classList.toggle('rel', me !== state.arch && rel.has(me));
    el.setAttribute('aria-pressed', String(me === state.arch));
  });
  const panel = document.getElementById('arch-detail');
  if (panel) panel.replaceChildren(...archDetail());
}

function treeView(t) {

  return track(t0, t1, off, [
    { label: '经历', sub: 'arc', marks: [{ a: Date.parse(t.arc.start), b: Date.parse(t.arc.end), shape: 'bar', cls: 'arc', label: t.arc.title, tip: () => ['经历：' + t.arc.title, span(t.arc.start, t.arc.end), '跨多个事件，可以跨天'] }] },

  if (!d.cards.length) return h('div', { class: 'empty' }, '模型没有写出任何事件。');
  return h('div', { class: 'cards' }, d.replayed ? h('div', { class: 'ribbon' }, d.replayed) : null, d.cards.map(c => cardView(c, { ctx })));
}
function dayView(ds, d) {
  const evIndex = Object.fromEntries((d.evidence || []).map(e => [e.id, e]));
  const cards = d.cards || [];
  const cardIndex = Object.fromEntries(cards.map(c => [c.id, c]));
  const rel = new Set(state.hl || []);
  if (state.sel && cardIndex[state.sel]) cardIndex[state.sel].evidence.forEach(i => rel.add(i));
  if (state.sel && evIndex[state.sel]) cards.forEach(c => { if (c.evidence.includes(state.sel)) rel.add(c.id); });
  const ctx = { evIndex, cardIndex, sel: state.sel, rel };
  const traps = new Set(((d.answer || {}).traps || []).flatMap(t => t.evidence));
  const counts = {};
  for (const e of d.evidence) counts[e.source] = (counts[e.source] || 0) + 1;
  const checks = d.checks || [];
  const head = h('div', { class: 'spread', style: 'margin-bottom:12px' },
    h('div', { class: 'row' }, h('h2', { style: 'margin:0' }, d.day), d.answer && d.answer.key ? chip(d.answer.key) : null,
      Object.entries(counts).map(([s, n]) => h('span', { class: 'chip' }, dot(s), `${L.source[s] || s} ${n}`)),
      d.cards ? chip(`卡片 ${d.cards.length} 张`, 'solid') : d.hidden ? chip(`卡片 ${d.hidden.cards} 张，口述后显示`, 'ghost') : chip('还没有卡片', 'ghost'),
      checks.length ? h('span', { class: checks.every(c => !c.error) ? 'stat-ok' : 'stat-bad' }, `核对 ${checks.filter(c => !c.error).length}/${checks.length}`) : null),
    h('div', { class: 'row' }, (state.sel || state.hl) ? h('button', { class: 'btn', type: 'button', onclick: () => go({ sel: null, hl: null }, true) }, '取消选中') : null,
      h('div', { class: 'seg', role: 'group', 'aria-label': '时间范围' },
        h('button', { type: 'button', 'aria-pressed': String(state.zoom === 'data'), onclick: () => go({ zoom: 'data' }, true) }, '有数据的时段'),
        h('button', { type: 'button', 'aria-pressed': String(state.zoom === 'day'), onclick: () => go({ zoom: 'day' }, true) }, '全天（4 点切天）'))));
  return h('div', { class: 'stack' },
    h('div', { class: 'panel' }, head, dayTimeline(d, ds, ctx), legend(),
      h('p', { class: 'small muted', style: 'margin:8px 0 0' }, '把鼠标放在色块上看详情。点一条证据，会标出引用它的卡片；点一张卡片，会标出它引用的证据。')),
    h('div', { class: 'grid2' },
      h('div', {}, h('h3', { style: 'margin-bottom:8px' }, `输入：证据条目（${d.evidence.length} 条）`), h('div', { class: 'panel', style: 'padding:8px 10px' }, evidenceTable(d.evidence, ctx, traps))),
      h('div', {}, h('h3', { style: 'margin-bottom:8px' }, `输出：事件卡片${d.cards ? `（${d.cards.length} 张）` : ''}`), outputColumn(ds, d, ctx))),
    d.checks ? checksPanel(d) : (d.answer && !d.cards ? h('div', { class: 'empty' }, '这一天有答案，生成卡片以后会自动核对。') : null),
    ds.experiment && d.experiment ? experimentPanel(ds, d) : null,
    personalPanels(d), droppedPanel(d), runsPanel(d));
}
function dayPicker(ds, current) {
  return h('div', { class: 'days' }, ds.days.map(d => {
    const checks = d.checks || [];
    const has = !!(d.cards && d.cards.length) || !!d.hidden;
    const label = d.answer && d.answer.key ? `${d.answer.key} · ${d.day.slice(5)}` : d.day;
    const sub = d.cards ? (checks.length ? `${checks.filter(c => !c.error).length}/${checks.length} 对` : `${d.cards.length} 张卡片`) : d.hidden ? '待口述' : `${d.evidence.length} 条证据`;
    return h('button', { class: `daychip${has ? '' : ' none'}`, type: 'button', 'aria-pressed': String(d.day === current), onclick: () => go({ day: d.day }, true) },

function pickDay(ds) {
  if (state.day && ds.days.some(d => d.day === state.day)) return state.day;
  const first = ds.days.find(d => d.cards && d.cards.length) || ds.days[0];
  return first ? first.day : null;
}

// ---------------------------------------------------------------- 测试数据
function experimentSummary(ds) {
  const e = ds.experiment;
  const keys = Object.keys(e.cells);
  const rowKeys = [...new Set(keys.flatMap(k => Object.keys(e.summary[k] || {})))];
  return h('details', { class: 'run', style: 'margin-top:12px' }, h('summary', {}, h('b', {}, '实验总表：已跑 12 天，每类项目错了几个')),
    h('div', { class: 'body scroll' }, h('table', { class: 't' },
      h('thead', {}, h('tr', {}, h('th', {}, '项目'), keys.map(k => h('th', { class: 'num' }, e.cells[k])))),
      h('tbody', {}, rowKeys.map(r => h('tr', {}, h('td', {}, L.unit[r] || L.type[r] || r),
        keys.map(k => { const v = (e.summary[k] || {})[r]; return h('td', { class: 'num' }, v ? `${v[0]} / ${v[1]} 错` : '—'); })))))),
    h('p', { class: 'small muted', style: 'margin:0 12px 12px' }, '完整结论见报告：', code(ds.about.report || '')));
}
function aboutPanel(ds) {

    h('div', { class: 'spread' }, h('h2', { style: 'margin:0' }, ds.name), h('span', { class: 'small muted' }, `从这一步进：${a.enters_at || '—'}`)),
    h('p', { style: 'margin-top:6px' }, a.description || ''),

    a.raw ? h('p', { class: 'small muted', style: 'margin-top:8px' }, `原始数据：${a.raw.sessions} 个采集会话，约 ${a.raw.megabytes} MB，每个会话 ${a.raw.files_per_session.length} 个文件。`) : null,
    ds.experiment ? experimentSummary(ds) : null);
}
function viewData() {
  const tests = DATA.datasets.filter(d => d.kind !== 'personal');
  if (!tests.length) return [h('div', { class: 'empty' }, h('h3', {}, '还没有测试数据'), pre('python3 experiments/phone_memory/testsets.py\npython3 experiments/phone_memory/dashboard.py'))];

  return [
    h('div', { class: 'row', style: 'margin-bottom:16px' }, h('div', { class: 'seg', role: 'group', 'aria-label': '测试数据' },
      tests.map(t => h('button', { type: 'button', 'aria-pressed': String(t.id === ds.id), onclick: () => go({ ds: t.id, day: null }, false) }, t.name)))),
    h('div', { class: 'stack' }, aboutPanel(ds), ds.days.length > 1 ? h('div', { class: 'panel' }, h('div', { class: 'cap' }, '选一天（虚线框的是还没有输出的日子）'), dayPicker(ds, day)) : null,
      d ? dayView(ds, d) : h('div', { class: 'empty' }, '这组数据还没有任何一天。')),
  ];
}

// ---------------------------------------------------------------- 你的数据
function coverageTable(ds) {
  const meta = ds.meta || {};
  return h('div', { class: 'panel scroll' }, h('table', { class: 't' },
    h('thead', {}, h('tr', {}, ['日期', '位置小时', '照片', '日历', '健康', '口述', '空手', '卡片', '核对'].map(x => h('th', {}, x)))),
    h('tbody', {}, ds.days.map(d => {
      const c = ds.coverage[d.day] || { counts: {}, location_hours: 0 };
      const count = prefix => Object.entries(c.counts || {}).filter(([k]) => k.startsWith(prefix)).reduce((n, [, v]) => n + v, 0);
      const m = meta[d.day] || {};
      const blind = m.written_at && (!m.cards_first_shown_at || m.written_at <= m.cards_first_shown_at);
      return h('tr', { class: `click${d.day === state.day ? ' sel' : ''}`, onclick: () => go({ day: d.day }, true) },
        h('td', {}, d.day), h('td', { class: 'num' }, c.location_hours || 0), h('td', { class: 'num' }, count('photo.')), h('td', { class: 'num' }, count('calendar.')),
        h('td', { class: 'num' }, count('health.')), h('td', {}, d.recall ? '有' : '—'), h('td', {}, d.recall ? (blind ? '是' : '否') : '—'),
        h('td', {}, d.cards ? `${d.cards.length} 张` : d.hidden ? `${d.hidden.cards} 张（待口述）` : '—'), h('td', {}, d.labels ? '有' : '—'));
    }))));
}
function scorePanel(score) {
  if (!score) return h('div', { class: 'empty' }, h('h3', {}, '还没有核对结果'), h('p', {}, '每天口述、生成、逐件核对以后，这里会显示精确率、召回和逐字段准确率。'));
  const fields = Object.entries(score.fields);
  const tiers = Object.entries(score.by_value);
  return h('div', { class: 'stack' },
    h('div', { class: 'tiles' },
      [['精确率', score.precision, `${score.correct_events}/${score.cards} 张卡片是真事`], ['召回', score.recall, `系统漏掉 ${score.missed_events} 件`],
       ['空手口述的天数', score.days_blind, `另有 ${score.days_excluded_not_blind} 天不进统计`]].map(([k, v, s]) =>
        h('div', { class: 'tile' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, typeof v === 'number' && v <= 1 && k !== '空手口述的天数' ? `${Math.round(v * 100)}%` : (v == null ? '—' : v)), h('div', { class: 's' }, s)))),
    h('div', { class: 'grid2' },
      h('div', { class: 'panel' }, h('h3', {}, '逐字段准确率'), h('p', { class: 'small muted', style: 'margin:4px 0 10px' }, '分母是卡片填了这个字段、而且这件事是真的'),
        fields.map(([f, v]) => h('div', { class: 'hbar' }, h('span', {}, L.field[f] || f),
          h('span', { class: 'track' }, v.accuracy != null ? h('span', { class: 'fill', style: `width:${Math.round(v.accuracy * 100)}%` }) : null),
          h('span', { class: 'num' }, v.accuracy != null ? `${Math.round(v.accuracy * 100)}%（${v.correct}/${v.filled}）` : '—')))),
      h('div', { class: 'panel scroll' }, h('h3', {}, '手机看见了多少（按值不值得记）'),
        h('table', { class: 't', style: 'margin-top:8px' }, h('thead', {}, h('tr', {}, ['档位', '手机看见', '只有你记得', '召回', '有语义来源'].map(x => h('th', {}, x)))),
          h('tbody', {}, tiers.map(([t, v]) => h('tr', {}, h('td', {}, L.tier[t] || t), h('td', { class: 'num' }, v.seen_by_phone), h('td', { class: 'num' }, v.only_you_remember),
            h('td', { class: 'num' }, v.phone_recall == null ? '—' : `${Math.round(v.phone_recall * 100)}%`), h('td', { class: 'num' }, v.semantic_share == null ? '—' : `${Math.round(v.semantic_share * 100)}%`))))))));
}
function viewPersonal() {
  if (DATA.publication) return [section('公开演示', '这里只展示格式示例与合成测试。个人看板请在自己的电脑生成。')];
  const ds = DATA.datasets.find(d => d.kind === 'personal');

    h('span', { class: 'chip' }, dot({ arc: 'location', photos: 'photo', calendar: 'calendar', health: 'health' }[k]), `${n}：${raw[k] ? `${raw[k]} 个文件` : '空'}`)));
  if (!ds || !ds.days.length) {

    section('统计', '只算空手口述的日子（cli.py score 的同一套算法）。', scorePanel(ds.score)),

  ];
}

// ---------------------------------------------------------------- 外壳
function render() {
  const view = document.getElementById('view');
  hideTip();
  const tabs = document.getElementById('tabs');
  tabs.replaceChildren(...TABS.map(([key, name]) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(state.tab === key), onclick: () => go({ tab: key, ds: null, day: null }) }, name)));
  const body = { overview: viewOverview, input: viewInput, output: viewOutput, data: viewData, personal: viewPersonal }[state.tab]();
  view.replaceChildren(...[body].flat(Infinity).filter(Boolean));
  requestAnimationFrame(() => fitLabels(view));
}
const THEMES = ['auto', 'light', 'dark'];
function applyTheme(mode) {
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode);
  document.getElementById('theme').textContent = `外观：${{ auto: '跟随系统', light: '浅色', dark: '深色' }[mode]}`;
  try { localStorage.setItem('dashboard-theme', mode); } catch (e) { /* 浏览器不让存也没关系 */ }
}
function init() {
  if (!DATA) { document.getElementById('view').append(h('div', { class: 'empty' }, '没有数据。请用 dashboard.py 生成这个文件。')); return; }
  let mode = 'auto';
  try { mode = localStorage.getItem('dashboard-theme') || 'auto'; } catch (e) { /* 忽略 */ }
  applyTheme(THEMES.includes(mode) ? mode : 'auto');
  document.getElementById('theme').addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme') || 'auto';
    applyTheme(THEMES[(THEMES.indexOf(now) + 1) % THEMES.length]);
  });
  document.getElementById('sub').textContent = `生成于 ${DATA.built_at.replace('T', ' ')} · 公开演示（合成数据） · ${DATA.datasets.map(d => d.name).join(' / ')}`;
  readHash();
  render();
  addEventListener('hashchange', () => { readHash(); render(); });
  let timer;
  addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(render, 150); });
}
init();
</script>
